name: Feature request
description: An API, setting or behaviour oneyaml doesn't have yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you ask: some things are out of scope by design (async I/O, schema validation, templating, building objects from tags; see [When not to use oneyaml](https://github.com/recursive-ai-oss/oneyaml-rust/blob/main/crates/oneyaml/README.md#when-not-to-use-oneyaml)), and any departure from YAML 1.2 can only be an opt-in, named setting that is off by default.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the API you have in mind. Include a YAML file or a code sketch if it helps.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: How you do it now with oneyaml, or why you can't.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: The API or setting you have in mind, and how another library does it, if one does.
  - type: checkboxes
    id: migration
    attributes:
      label: Migration
      options:
        - label: This is something `serde_yaml` (or a fork) does that oneyaml doesn't, and I checked the [migration guide](https://github.com/recursive-ai-oss/oneyaml-rust/blob/main/docs/migrating-from-serde-yaml.md).

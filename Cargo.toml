[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.2.0"
edition = "2024"
# MSRV check. `oracles`, `bench` and `fuzz` are unpublished
# tooling whose comparator dependencies need a newer rustc, so the gate
# excludes them:
#   cargo +1.85 check --workspace --exclude oracles --exclude bench --exclude fuzz --all-targets --all-features
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/recursive-ai-oss/oneyaml-rust"

# For comparing oneyaml with itself only (`bench probe` before and after
# a change): release settings in a single codegen unit, so counts don't
# move when unrelated code changes how the compiler splits and inlines
# code. It also changes every comparator's counts, so the benchmark
# tables never come from it; they come from the default release build.
#   cargo build -p bench --profile measure    # then target/measure/bench
# Workspace profiles never apply to the published crates as a
# dependency, and everyday `cargo build` / `cargo test` keep their
# defaults.
[profile.measure]
inherits = "release"
codegen-units = 1

# Fast test loop: `cargo t1` (see CONTRIBUTING.md). The workspace crates are
# built at `opt-level = 1` and the other libraries at `opt-level = 2`, with
# debug assertions and overflow checks kept on, because the code relies on
# them. Incremental builds make a rebuild after an edit quick. A custom
# profile only applies when it is named (`--profile t1`), and profiles of
# dependencies are ignored, so nothing here touches `cargo build
# --release` or what a user of the published crates compiles.
[profile.t1]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true
incremental = true

[profile.t1.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

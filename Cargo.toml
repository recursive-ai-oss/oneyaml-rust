[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.1"
edition = "2024"
# MSRV check. `oracles`, `bench` and `fuzz` are unpublished
# tooling whose comparator dependencies need a newer rustc, so the gate
# excludes them:
#   cargo +1.85 check --workspace --exclude oracles --exclude bench --exclude fuzz --all-targets --all-features
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/recursive-ai-oss/oneyaml-rust"

# The build every published benchmark number comes from:
#   cargo build -p bench --profile measure    # then target/measure/bench
# Release settings in a single codegen unit, so what the compiler inlines,
# and with it the instruction counts, does not move when
# unrelated code changes. Workspace profiles never apply to the published
# crates as a dependency, and everyday `cargo build` / `cargo test` keep
# their defaults.
[profile.measure]
inherits = "release"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
# MSRV check. `oracles`, `bench` and `fuzz` are unpublished
# tooling whose comparator dependencies need a newer rustc, so the gate
# excludes them:
#   cargo +1.85 check --workspace --exclude oracles --exclude bench --exclude fuzz --all-targets --all-features
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/recursive-ai-oss/oneyaml-rust"

# For comparing oneyaml with itself only (`bench probe` before and after
# a change): release settings in a single codegen unit, so counts don't
# move when unrelated code changes how the compiler splits and inlines
# code. It also changes every comparator's counts, so the benchmark
# tables never come from it; they come from the default release build.
#   cargo build -p bench --profile measure    # then target/measure/bench
# Workspace profiles never apply to the published crates as a
# dependency, and everyday `cargo build` / `cargo test` keep their
# defaults.
[profile.measure]
inherits = "release"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[package]
name = "bench"
description = "Benchmarks for oneyaml (parser, syntax tree, serde read and write, Document parse/emit/edits) against other YAML implementations: instructions, allocations, wall-clock, linear scaling (unpublished)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
oneyaml-core = { path = "../oneyaml-core" }
oneyaml-syntax = { path = "../oneyaml-syntax" }
# Comparators, only through the oracles crate (the only crate allowed to
# depend on other YAML implementations).
oracles = { path = "../oracles" }
# The serde sections: our public entry points, the typed models'
# derives, and serde_json as the common form of the correctness guard.
oneyaml = { path = "../oneyaml" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
# The workspace gates compile and test oneyaml's optional
# `serde_json` conversions (tests/value_differential.rs) and its
# optional `miette` support (tests/miette_feature.rs; `cargo test
# --workspace` and `clippy --workspace` then build oneyaml with it, which
# also runs oneyaml's own tests/miette_diag.rs).
oneyaml = { path = "../oneyaml", features = ["serde_json", "miette", "__internal-checks"] }
miette = { version = "7.6.0", default-features = false }
# The corpus of the consistency checks (tests/consistency.rs).
test-suite = { path = "../test-suite" }

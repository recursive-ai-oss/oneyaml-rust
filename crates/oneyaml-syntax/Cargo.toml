[package]
name = "oneyaml-syntax"
description = "Lossless YAML 1.2 decoder, parser, event stream, and syntax tree underneath oneyaml."
keywords = ["yaml", "parser", "lossless", "syntax-tree"]
categories = ["parser-implementations", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/oneyaml-syntax"
# `oneyaml-syntax` has its own semver track (it may stay 0.x and break
# more often than `oneyaml`), so it does
# not take the workspace version that `oneyaml` and `oneyaml-core` share.
# `oneyaml` reaches it only through `doc.syntax()`, which is outside the
# stability promise.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
oneyaml-core = { path = "../oneyaml-core", version = "1.2.0" }

[features]
# Test-only work counters (`tree::take_work`) for this crate's tests and the
# tests of `oneyaml`. Unstable: not covered by semver, may change or go in
# any release; never enable it in a library.
__internal-checks = []

[dev-dependencies]
# The integration tests use the test-only counters.
oneyaml-syntax = { path = ".", features = ["__internal-checks"] }

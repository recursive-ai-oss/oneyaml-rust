[package]
name = "oneyaml"
description = "oneyaml — one core, one interpretation: serde + lossless editing for YAML 1.2."
keywords = ["yaml", "serde", "lossless", "parser", "config"]
categories = ["encoding", "parser-implementations", "config"]
readme = "README.md"
documentation = "https://docs.rs/oneyaml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# docs.rs builds the public features (never `__internal-checks`, which is
# test-only and outside semver). `--cfg docsrs` turns on rustdoc's `doc_cfg`
# (src/lib.rs), so items behind a feature carry its badge; stable builds
# never see that cfg.
[package.metadata.docs.rs]
features = ["miette", "serde_json"]
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
oneyaml-core = { path = "../oneyaml-core", version = "1.2.0" }
oneyaml-syntax = { path = "../oneyaml-syntax", version = "0.2.0" }
# serde without `derive` is the only required third-party runtime dependency.
serde = { version = "1.0.228", default-features = false, features = ["std"] }
# Optional `miette` diagnostics rendering; without its
# default `derive` feature it adds only `cfg-if` and `unicode-width`.
miette = { version = "7.6.0", default-features = false, optional = true }
# Optional `serde_json::Value` conversions; off by default.
serde_json = { version = "1.0.149", default-features = false, features = ["std"], optional = true }

[features]
# `Error` and `DiagnosticReport` implement `miette::Diagnostic`.
miette = ["dep:miette"]
# Conversions between `Value` and `serde_json::Value`.
serde_json = ["dep:serde_json"]
# Test-only checks (`Document::check_lookup_indexes`,
# `Tag::same_allocation`, `Tag::shares_prefix_with`) for this crate's tests
# and the unpublished `bench`/`fuzz` crates. Unstable: not covered by
# semver, may change or go in any release; never enable it in a library.
__internal-checks = []

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The integration tests and doc tests use the test-only checks.
oneyaml = { path = ".", features = ["__internal-checks"] }
# The scaling tests count the syntax layer's work instead of measuring time.
oneyaml-syntax = { path = "../oneyaml-syntax", features = ["__internal-checks"] }

# The real-world examples assert their own output; `cargo test`
# runs them.
[[example]]
name = "edit_config"
test = true

[[example]]
name = "k8s_manifest"
test = true

[[example]]
name = "gha_workflow"
test = true

[[example]]
name = "compose_merge"
test = true

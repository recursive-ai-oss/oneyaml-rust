[package]
name = "oracles"
description = "Test-only differential oracles: other YAML implementations scored on yaml-test-suite (unpublished)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
test-suite = { path = "../test-suite" }
saphyr-parser = "=0.1.0"
yaml-rust2 = "=0.13.0"
unsafe-libyaml = "=0.2.11"
yaml-edit = "=0.3.2"
# For `AstNode::syntax` on yaml-edit trees (the version yaml-edit uses).
rowan = "=0.16.1"
# Serde comparators for the bench crate's `serde` section. Pinned so
# the tables are reproducible; never a dependency of a published crate.
serde_yaml_ng = "=0.10.0"
serde_norway = "=0.9.42"
serde_yaml2 = "=0.1.3"
# The saphyr project's own `saphyr-serde` is a 0.0.0 placeholder; this is
# the third-party serde layer over (a fork of) saphyr-parser.
serde-saphyr = "=1.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
# Our serializer, checked against the readers and writers above.
oneyaml = { path = "../oneyaml" }
# The allocation gate for the serializer (`tests/ser_allocations.rs`). Its
# counting `#[global_allocator]` is an `unsafe impl`, so it lives here, the
# only crate allowed unsafe-containing dependencies.
allocation-counter = "0.8.1"

# The workspace lints, except `unsafe_code` is `deny` rather than `forbid`:
# `forbid` cannot be lifted locally, and src/libyaml.rs must call
# unsafe-libyaml's `unsafe fn` API (this is the only crate allowed to use
# unsafe-containing YAML implementations). That module alone allows it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
undocumented_unsafe_blocks = "deny"

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="361" viewBox="0 0 760 361" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
<title id="title">oneyaml: × faster than each competitor (CPU instructions)</title>
<desc id="desc">Bar chart: how many times fewer CPU instructions oneyaml executes than each competitor (competitor ÷ oneyaml; higher is better; 1.0× is equal), against the fastest feature-complete YAML serde library on each workload for serde read and serde write, and yaml-edit for Document parse and Document edit script (insert + set + remove). serde read: gha-workflow 1.3× vs serde_yaml_ng, compose-merge 1.2× vs serde_yaml_ng, helm-values 1.7× vs serde_norway, openapi-100k 1.0× vs serde_yaml_ng, k8s-multi 1.2× vs serde_norway. serde write: gha-workflow 1.4× vs serde-saphyr, compose-merge 1.4× vs serde-saphyr, helm-values 1.3× vs serde-saphyr, openapi-100k 1.4× vs serde-saphyr, k8s-multi 1.5× vs serde-saphyr. Document parse: gha-workflow 1.5× vs yaml-edit, compose-merge 1.2× vs yaml-edit, helm-values 1.4× vs yaml-edit, openapi-100k 1.1× vs yaml-edit, k8s-multi 1.1× vs yaml-edit. Document edit script (insert + set + remove): gha-workflow 2.3× vs yaml-edit, compose-merge 0.60× — slower vs yaml-edit, helm-values 9.9× vs yaml-edit, openapi-100k 64× vs yaml-edit, k8s-multi 3.2× vs yaml-edit.</desc>

<text x="16" y="61" fill="#59636e">orange, hatched bars = oneyaml slower; bars longer than 3.5× are drawn broken</text>
<text x="16" y="79" fill="#59636e">one bar per workload, top to bottom: gha-workflow, compose-merge, helm-values, openapi-100k, k8s-multi</text>
